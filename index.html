<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>Grid to Glory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Rekaan v5: "Merah Klasik" retro moden. Putih hangat, teks navy, emas sebagai warna kedua.
   Warna utama (--acc) ikut pasukan pemain, ditetapkan oleh applyTheme() dalam ui1.js.
   Tipografi: Chakra Petch (italik tebal untuk nombor dan tajuk). */
:root {
  --bg: #f7f4ee; --panel: #ffffff; --panel2: #f1ede5; --line: #e6e2d8; --line2: #d9d3c6;
  --fg: #1b2340; --dim: #6f7487;
  --acc: #e2342b; --accDeep: #b8241d; --onAcc: #ffffff; --accSoft: #fbe3e1;
  --a2: #f0b429; --onA2: #1b2340; --navy: #1b2340;
  --good: #1f9d55; --warn: #b77a00; --bad: #d93a2f; --pur: #7b4cdb;
  --disp: 'Chakra Petch', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; margin: 0; }
.app { max-width: 1080px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app::before { content: ''; display: block; height: 5px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 12px; background: linear-gradient(90deg, var(--acc) 0 33.3%, var(--a2) 33.3% 66.6%, var(--navy) 66.6%); }
h1, h2, h3 { font-family: var(--disp); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 34px; font-style: italic; } h2 { font-size: 22px; font-style: italic; text-transform: uppercase; letter-spacing: .01em; }
h3 { font-size: 11px; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
p { margin: 0; } .dim { color: var(--dim); } .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .pur { color: var(--pur); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.brand { font: italic 700 21px/1 var(--disp); letter-spacing: .02em; text-transform: uppercase; }
.brand b { color: var(--acc); font-weight: 700; }
.meta { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 13px; flex-wrap: wrap; }

.card { background: var(--panel); border-radius: var(--r); padding: 14px; min-width: 0; box-shadow: 0 1px 0 var(--line), 0 6px 18px #1b23400a; }
.card.flat { background: transparent; box-shadow: none; }
.card.nextc { background: var(--accDeep); color: #fff; position: relative; overflow: hidden; }
.card.nextc::after { content: ''; position: absolute; right: -30px; top: 0; bottom: 0; width: 96px; background: linear-gradient(100deg, transparent 0 16px, var(--acc) 16px 26px, transparent 26px 32px, var(--a2) 32px 42px, transparent 42px 48px, #ffffff33 48px 58px, transparent 58px); opacity: .9; pointer-events: none; }
.card.nextc h3, .card.nextc .dim { color: #ffffffcc; } .card.nextc > * { position: relative; z-index: 1; }
.card.nextc .chip { background: #ffffff1f; border-color: #ffffff33; color: #fff; } .card.nextc .chip b { color: #fff; }
.card.nextc .btn.pri { background: #fff; color: var(--accDeep); border-color: #fff; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.sp { justify-content: space-between; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 860px) { .cols.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .cols.race { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 28px; } }

.btn { font: italic 700 14px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; background: var(--panel); color: var(--fg); border: 1px solid var(--line2); border-radius: 11px; padding: 12px 16px; cursor: pointer; min-height: 44px; }
.btn:hover:not(:disabled) { border-color: var(--fg); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--onAcc); box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 30%, transparent); }
.btn.pri:hover:not(:disabled) { filter: brightness(1.05); }
.btn.bad { border-color: #f1c4bf; color: var(--bad); }
.btn.sm { padding: 7px 11px; min-height: 34px; font-size: 12.5px; border-radius: 9px; }
.btn.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.btn.wide { width: 100%; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { font: 600 13px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--acc); font-style: italic; font-weight: 700; }

.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border-radius: 20px; font-size: 12px; color: var(--dim); background: var(--panel2); }
.chip b { color: var(--fg); font-weight: 700; }
.tag { display: inline-block; font: 600 12px/1 var(--mono); letter-spacing: .02em; padding: 3px 6px 3px 7px; border-left: 3px solid var(--tc, var(--dim)); background: var(--panel2); border-radius: 3px; color: var(--fg); }
.numb { display: inline-grid; place-items: center; min-width: 46px; height: 46px; font: italic 700 23px/1 var(--disp); background: var(--acc); color: var(--onAcc); border-radius: 12px; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font: 600 10.5px/1 var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding: 7px 6px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr.me td { background: var(--accSoft); font-weight: 600; }
table.t td.r, table.t th.r { text-align: right; }
.scroll { overflow-x: auto; }

.bar { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 4px; }
.bar.g > i { background: var(--good); } .bar.y > i { background: var(--a2); } .bar.r > i { background: var(--bad); }
.skill { display: grid; grid-template-columns: minmax(96px, 130px) minmax(0, 1fr) 34px auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.skill .nm { font: italic 700 14px var(--disp); text-transform: uppercase; }
@media (max-width: 560px) { .skill { grid-template-columns: minmax(0, 1fr) 34px auto; } .skill .bar { grid-column: 1 / -1; order: 5; } }

.ty { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--c, #888); font: 700 10.5px/1 var(--mono); color: var(--fg); background: #fff; }
.ty.big { width: 30px; height: 30px; font-size: 14px; }

/* menara */
.tower { font: 13px/1 var(--body); }
.tr { display: grid; grid-template-columns: 22px 46px minmax(0, 1fr) 64px 38px 18px 12px; gap: 6px; align-items: center; padding: 7px 6px; border-bottom: 1px solid var(--line); }
.tr.me { background: var(--accSoft); border-radius: 8px; font-weight: 700; }
.tr.head { color: var(--dim); font: 600 10px/1 var(--disp); letter-spacing: .12em; text-transform: uppercase; }
.tr > span:first-child { font: italic 700 13px var(--disp); text-align: center; }
.tr .c { border-left: 3px solid var(--tc); padding-left: 6px; font-weight: 700; font-family: var(--mono); font-size: 12px; }
.tr .g { text-align: right; font-family: var(--mono); font-size: 12px; }
.tr.out { opacity: .45; }
.tr.rv { box-shadow: inset 3px 0 var(--a2); }
.tr.gap { display: block; text-align: center; color: var(--dim); padding: 2px; font-size: 11px; border: 0; }
.pit { color: var(--warn); font-size: 11px; font-weight: 700; }

.strip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lapno { font: italic 700 28px/1 var(--disp); }
.badge { font: 700 10.5px/1 var(--disp); letter-spacing: .12em; text-transform: uppercase; padding: 5px 9px; border-radius: 20px; background: var(--panel2); color: var(--dim); }
.badge.sc { background: var(--a2); color: var(--onA2); }
.badge.wet { background: #dbeaf7; color: #1d5f99; }
.radio { max-height: 300px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.radio div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
.radio .l { font: 600 11px var(--mono); color: var(--dim); padding-top: 1px; }
.radio .sc { color: var(--warn); } .radio .w { color: #1d5f99; } .radio .x { color: var(--bad); } .radio .e { color: var(--fg); } .radio .me { color: var(--good); font-weight: 600; } .radio .i { color: var(--dim); }

.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.opt { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px; cursor: pointer; color: var(--fg); font: inherit; }
.opt:hover { border-color: var(--line2); }
.opt.on { border-color: var(--acc); background: var(--accSoft); }
.opt .t { font: italic 700 15px var(--disp); text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.opt .s { font-size: 12.5px; color: var(--dim); margin-top: 4px; }
input[type=text] { width: 100%; background: var(--panel); color: var(--fg); border: 1.5px solid var(--line2); border-radius: 10px; padding: 11px 12px; font: 600 17px var(--body); }
input[type=range] { width: 100%; accent-color: var(--acc); }
textarea { width: 100%; min-height: 90px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line2); border-radius: 10px; padding: 10px; font: 12px var(--mono); }

/* modal + mini game */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(27, 35, 64, .62); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mbox { width: min(520px, 100%); background: var(--bg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; box-shadow: 0 20px 60px #1b234055; border-top: 5px solid var(--acc); }
.mbox h2 { font-size: 24px; }
.lights { display: flex; gap: 10px; justify-content: center; }
.lights i { width: 15%; max-width: 62px; aspect-ratio: 1; border-radius: 50%; background: #e6e2d8; border: 2px solid #d9d3c6; }
.lights i.on { background: #ff2e45; border-color: #ff7a8a; box-shadow: 0 0 18px #ff2e45aa; }
.big { font: italic 700 46px/1 var(--disp); text-align: center; }
.hit { width: 100%; min-height: 110px; font-size: 22px; }
.track { position: relative; height: 48px; background: var(--panel2); border-radius: 12px; overflow: hidden; touch-action: manipulation; box-shadow: inset 0 0 0 1px var(--line2); }
.track .zone { position: absolute; top: 0; bottom: 0; background: #1f9d5533; border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
.track .mk { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--navy); border-radius: 2px; }
.sectors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sec { padding: 8px; border-radius: 10px; text-align: center; font: 600 13px var(--mono); color: var(--dim); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.sec.pur { color: var(--pur); box-shadow: inset 0 0 0 2px var(--pur); } .sec.good { color: var(--good); box-shadow: inset 0 0 0 2px var(--good); } .sec.warn { color: var(--warn); box-shadow: inset 0 0 0 2px var(--a2); }
.wheels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 60px; padding: 8px 40px; position: relative; }
.wheel { aspect-ratio: 1.5; border-radius: 14px; background: var(--panel); border: 2px solid var(--line2); color: var(--dim); font: italic 700 16px var(--disp); cursor: pointer; }
.wheel.lit { background: var(--a2); border-color: #c98f00; color: var(--onA2); box-shadow: 0 0 16px #f0b42988; }
.wheel.done { background: #dff3e6; border-color: var(--good); color: var(--good); }
.shake { animation: shk .2s 2; }
@keyframes shk { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; max-width: calc(100vw - 32px); }
.hero { display: flex; flex-direction: column; gap: 14px; padding: 22px 0 8px; }
.hero .stripe { height: 6px; background: linear-gradient(90deg, var(--acc) 0 33.3%, var(--a2) 33.3% 66.6%, var(--navy) 66.6%); border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.evopts { display: flex; flex-direction: column; gap: 8px; }
.cmpbox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px; background: var(--panel); border-radius: 12px; }
.cmpbox .vs { font: italic 700 14px var(--disp); color: var(--dim); }
.cmp { min-width: 0; }
.md { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line2); vertical-align: middle; }
.md.m0 { background: var(--good); } .md.m2 { background: var(--bad); }
.news { background: var(--navy); color: #fff; }
.news h3 { color: #f0b429; } .news .dim { color: #c6cbe0; }
.headline { font: italic 700 23px/1.1 var(--disp); text-transform: uppercase; margin-top: 6px; text-wrap: balance; }
.stps { display: flex; gap: 8px; justify-content: center; }
.stp { width: 26px; height: 8px; border-radius: 4px; background: var(--line2); }
.stp.cur { background: var(--navy); } .stp.ok { background: var(--good); } .stp.no { background: var(--bad); }
.bigarrow { font: italic 700 72px/1 var(--disp); text-align: center; color: var(--acc); }
.lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lane { min-height: 130px; border: 2px dashed var(--line2); background: var(--panel); color: var(--dim); font: italic 700 15px var(--disp); text-transform: uppercase; border-radius: 14px; cursor: pointer; }
.lane.blk { border-style: solid; border-color: var(--bad); background: #fde3e0; color: var(--bad); }

/* ---------- race v5 ---------- */
.race5 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 900px) { .race5 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.rhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.lbl { font: 600 9.5px var(--disp); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
.llwrap { position: relative; }
.ll { position: relative; height: 104px; margin-top: 4px; }
.ll .bar5 { position: absolute; left: 2%; right: 2%; top: 46px; height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--acc) 0 33.3%, var(--a2) 33.3% 66.6%, var(--navy) 66.6%); opacity: .25; }
.ll .z { position: absolute; top: 62px; transform: translateX(-50%); font: 600 9px var(--disp); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: center; white-space: nowrap; }
.ll .z::before { content: ''; display: block; width: 2px; height: 8px; background: var(--fg); opacity: .5; margin: 0 auto 2px; }
.ll .fin { position: absolute; top: 36px; height: 28px; width: 4px; left: 2%; background: repeating-linear-gradient(var(--fg) 0 4px, #fff 4px 8px); border-radius: 1px; }
.ll .c { position: absolute; top: 40px; width: 10px; height: 20px; border-radius: 6px; transform: translateX(-50%); border: 2px solid var(--panel); will-change: left; }
.ll .c.me { width: 15px; height: 28px; top: 36px; box-shadow: 0 0 0 2px var(--fg); z-index: 3; }
.ll .c.rv { box-shadow: 0 0 0 2px var(--a2); z-index: 2; }
.ll .c.hold { opacity: .45; }
.ll .t { position: absolute; transform: translateX(-50%); font: 700 10px var(--disp); padding: 1px 6px; border-radius: 9px; background: var(--fg); color: #fff; white-space: nowrap; z-index: 4; }
.ll .t.me { background: var(--acc); color: var(--onAcc); }
.ll .t.rv { background: var(--a2); color: var(--onA2); }
.rib { position: relative; height: 90px; }
.rib .ax { position: absolute; left: 0; right: 0; top: 36px; height: 3px; border-radius: 3px; background: var(--line); }
.rib .drs { position: absolute; top: 30px; height: 15px; border-radius: 8px; background: var(--navy); opacity: .12; }
.rib .k { position: absolute; top: 74px; transform: translateX(-50%); font: 600 9.5px var(--mono); color: var(--dim); }
.rib .d { position: absolute; transform: translateX(-50%); text-align: center; font: 700 10px var(--disp); white-space: nowrap; will-change: left; }
.rib .d i { display: block; margin: 2px auto 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1.5px var(--fg); }
.rib .d.me i { width: 18px; height: 18px; background: var(--acc); box-shadow: 0 0 0 2px var(--accDeep); }
.btchip { font: 700 9.5px var(--disp); letter-spacing: .14em; padding: 2px 8px; border-radius: 9px; background: var(--panel2); color: var(--dim); }
.btchip.on { background: var(--acc); color: var(--onAcc); }
.posl { display: flex; align-items: center; gap: 12px; }
.posl .bigp { font: italic 700 56px/.85 var(--disp); color: var(--accDeep); }
.posl .gp { font-size: 13px; line-height: 1.55; } .posl .gp b { font-family: var(--mono); font-size: 12.5px; }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
.ring { width: 64px; height: 64px; margin: 0 auto 3px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--rc) calc(var(--v) * 1%), var(--panel2) 0); }
.ring b { width: 50px; height: 50px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font: italic 700 14px var(--disp); }
.rings small { font: 600 9px var(--disp); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; text-align: center; padding: 9px 0; font: 600 12px var(--disp); text-transform: uppercase; border-radius: 9px; color: var(--dim); cursor: pointer; min-height: 38px; }
.seg button.on { background: var(--navy); color: #fff; font-style: italic; font-weight: 700; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts .btn { min-height: 50px; font-size: 15px; border: 0; }
.acts .boost { background: var(--acc); color: var(--onAcc); }
.acts .pitb { background: var(--a2); color: var(--onA2); }
.tyrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tyrow .btn { padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; min-height: 52px; }
.pitnote { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 12px; background: #fff3d6; color: #7a5200; font-weight: 600; font-size: 13.5px; }
.ctlrow { display: flex; gap: 6px; flex-wrap: wrap; }
.bub { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.bub .av { width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--navy); color: #f0b429; display: grid; place-items: center; font: italic 700 10px var(--disp); }
.bub p { margin: 0; background: var(--panel); border-radius: 4px 14px 14px 14px; padding: 8px 11px; box-shadow: 0 1px 0 var(--line); flex: 1; }
.bub p small { display: block; font: 700 9px var(--disp); letter-spacing: .14em; color: var(--accDeep); }

/* ---------- tema ikut warna pasukan ---------- */
function _rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
function _hex(c) { return '#' + c.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
function _lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function _L(h) { var c = _rgb(h); return 0.2126 * _lin(c[0]) + 0.7152 * _lin(c[1]) + 0.0722 * _lin(c[2]); }
function _con(a, b) { var x = _L(a), y = _L(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function _mix(a, b, t) { var p = _rgb(a), q = _rgb(b); return _hex([0, 1, 2].map(function (i) { return p[i] + (q[i] - p[i]) * t; })); }
function _hue(h) { var c = _rgb(h).map(function (v) { return v / 255; }), mx = Math.max.apply(null, c), mn = Math.min.apply(null, c), d = mx - mn; if (d < 0.16) return -1; var hh = mx === c[0] ? ((c[1] - c[2]) / d) % 6 : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4; return (hh * 60 + 360) % 360; }
function themeOf(col) {
  var deep = '#141a33', t; for (t = 0; t <= 1; t += 0.05) { var c = _mix(col, '#141a33', t); if (_con(c, '#ffffff') >= 4.5) { deep = c; break; } }
  var hu = _hue(col), a1 = hu < 0 ? deep : col, a2 = (hu >= 30 && hu <= 65) ? '#1b2340' : '#f0b429';
  return { acc: a1, accDeep: deep, onAcc: _con(a1, '#ffffff') >= _con(a1, '#141a33') ? '#ffffff' : '#141a33', accSoft: _mix(a1, '#ffffff', 0.86), a2: a2, onA2: _con(a2, '#ffffff') >= _con(a2, '#141a33') ? '#ffffff' : '#1b2340' };
}
var _themeKey = '';
function applyTheme() {
  var col = UI.screen === 'new' && UI.draft && UI.draft.team != null ? TEAMS[UI.draft.team].color : UI.screen === 'menu' ? '#e2342b' : (S && S.drivers && S.teams) ? S.teams[me().team].color : '#e2342b';
  if (col === _themeKey) return; _themeKey = col;
  var th = themeOf(col), r = document.documentElement.style;
  r.setProperty('--acc', th.acc); r.setProperty('--accDeep', th.accDeep); r.setProperty('--onAcc', th.onAcc); r.setProperty('--accSoft', th.accSoft); r.setProperty('--a2', th.a2); r.setProperty('--onA2', th.onA2);
}
function render() {
  applyTheme();
  var h = '';
  if (UI.screen === 'menu') h = vMenu();
  else if (UI.screen === 'new') h = vNew();
  else if (UI.screen === 'hub') h = (S && S.sit && typeof vSit === 'function') ? vSit() : vHub();
  else if (UI.screen === 'wk') h = vWk();
  else if (UI.screen === 'season') h = vSeason();
  else if (UI.screen === 'review') h = vReview();
  else if (UI.screen === 'retire') h = vRetire();
  $app.innerHTML = '<div class="app">' + h + '</div>';
  var key = UI.screen + (UI.wk ? UI.wk.step : '');
  if (key !== UI.last) { UI.last = key; window.scrollTo(0, 0); }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  /* klik hantu: jari yang tekan butang mini game jatuh atas butang baru (Teruskan) di tempat sama. Abaikan klik dalam popup yang baru muncul. */
  if (b.closest('#modal') && performance.now() - (UI.modalT || 0) < 650) return;
  var f = A[b.dataset.act];
  if (f) f(b.dataset, b);
});
/* butang masa-kritikal (mini game): bertindak masa jari MENYENTUH, bukan masa angkat */
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest('[data-tap]');
  if (!b || b.disabled) return;
  if (UI.mgArm && performance.now() < UI.mgArm) { e.preventDefault(); return; }
  e.preventDefault();
  var f = A[b.dataset.tap];
  if (f) f(b.dataset, b, e);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'nm') UI.draft.name = t.value;
  if (t.id === 'plap' && UI.wk) { UI.wk.planLap = +t.value; var o = document.getElementById('plapv'); if (o) o.textContent = 'Lap ' + t.value; }
});
document.addEventListener('keyup', function (e) { if ((e.code === 'Space' || e.key === ' ') && UI.mkeyUp) { e.preventDefault(); UI.mkeyUp(e); } });
document.addEventListener('keydown', function (e) {
  if ((e.code === 'Space' || e.key === ' ') && UI.mkeyDown) { e.preventDefault(); if (!e.repeat) UI.mkeyDown(e); return; }
  if ((e.code === 'Space' || e.key === ' ') && UI.mkey) { e.preventDefault(); if (!e.repeat) UI.mkey(e); }
  if (UI.mkeyLR && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); UI.mkeyLR(e.key === 'ArrowLeft' ? 'L' : 'R'); }
});

    chip('Tyre wear', c.wear < 0.95 ? 'Low' : c.wear < 1.15 ? 'Medium' : 'High') +
    chip('Overtaking', c.ot < 0.5 ? 'Easy' : c.ot < 0.7 ? 'Medium' : 'Hard') +
    chip('Engine', c.pw >= 0.55 ? 'Important' : c.pw <= 0.4 ? 'Minor' : 'Medium');

'use strict';
/* ===== Mini game v3: penilaian adil =====
   Prinsip (rujukan reka bentuk game ritma/timing):
   1. Nilai ikut masa SENTUHAN (cap masa event), tolak kependaman skrin+sentuh (~60 ms), supaya apa yang kau NAMPAK ialah apa yang dinilai.
   2. Gred jelas dengan tingkap tetap: SEMPURNA / BAGUS / HAMPIR / TERLEPAS, plus arah (awal atau lewat).
   3. Penanda berhenti di tempat kau tekan dan zon kekal ditunjuk, jadi kau nampak sendiri kenapa dapat gred tu.
   4. Hanya butang besar yang terima input. Input diabaikan 250 ms pertama selepas game muncul. Satu input = satu penilaian. */
var MGT = { lat: 60, arm: 250 };
var GRD = { P: { n: 'PERFECT', q: 1, c: 'pur' }, B: { n: 'GOOD', q: 0.8, c: 'good' }, O: { n: 'CLOSE', q: 0.5, c: 'warn' }, M: { n: 'MISS', q: 0.15, c: 'bad' } };
function tEv(e) { return e && e.timeStamp ? e.timeStamp : performance.now(); }

function arm() { UI.mgArm = performance.now() + MGT.arm; }
function trackH(id, zones, extra) {

}
function zoneH(a, b, cls) { return '<div class="' + cls + '" style="left:' + (a * 100) + '%;width:' + ((b - a) * 100) + '%"></div>'; }

/* 1. Timing ulang-alik (hairpin, cabaran) */
function timingGame(title, hint, zoneW, sp, cb) {
  /* tingkap masa tetap (ms), lebar zon dikira dari laju penanda: apa yang kau nampak = tingkap sebenar */
  var sk = clamp(zoneW / 0.12, 0.8, 1.25), wP = 0.042 * sk, wB = 0.088 * sk, wO = 0.13 * sk, zw = 2 * wB * sp, sw = 2 * wP * sp, c = 0.22 + rnd() * 0.56, t0 = 0, raf = 0, done = false;
  function pos(t) { var ph = ((t - t0) / 1000 * sp) % 2; return ph < 1 ? ph : 2 - ph; }
  function dir(t) { var ph = ((t - t0) / 1000 * sp) % 2; return ph < 1 ? 1 : -1; }
  showModal('<h2>' + esc(title) + '</h2><p class="dim">' + hint + '</p>' + trackH('tg3', zoneH(c - zw / 2, c + zw / 2, 'zone') + zoneH(c - sw / 2, c + sw / 2, 'sweet')) +
    '<div class="vd3" id="vd3"><span>Dark green in the middle = PERFECT</span></div><button class="btn pri hit" data-tap="mg-tg" style="min-height:80px">BRAKE!</button>');
  function lp(now) { if (done) return; var m = document.getElementById('tg3m'); if (m) m.style.left = (pos(now) * 100) + '%'; raf = requestAnimationFrame(lp); }
  function press(e) {
    if (done || !armed()) return; done = true; cancelAnimationFrame(raf); UI.mkey = null;
    var t = tEv(e) - MGT.lat, x = pos(t), err = x - c, a = Math.abs(err), ms = a / sp, g = ms <= wP ? 'P' : ms <= wB ? 'B' : ms <= wO ? 'O' : 'M';
    var early = (err * dir(t)) < 0;
    var m = document.getElementById('tg3m'); if (m) m.style.left = (x * 100) + '%';
    hitMark('tg3', x); verdict(g, g === 'P' ? 'Dead centre' : (early ? 'Early ' : 'Late ') + Math.round(a / sp * 1000) + ' ms');
    setTimeout(function () { closeModal(); cb(GRD[g].q); }, 1000);
  }
  A['mg-tg'] = function (d, b, e) { press(e); }; UI.mkey = press; arm(); t0 = performance.now(); raf = requestAnimationFrame(lp);
}

  function pos(t) { var u = (t - t0) / dur; return Math.max(0, u * u * 0.6 + u * 0.4); }
  showModal('<h2>' + esc(title) + '</h2><p class="dim">' + hint + '</p>' + trackH('bk3', zoneH(z0, z1, 'zone') + zoneH(s0, z1, 'sweet') + zoneH(z1, 1, 'red3')) +
    '<div class="vd3" id="vd3"><span>End of the green zone (dark) = PERFECT. Red = overshot.</span></div><button class="btn pri hit" data-tap="mg-brk" style="min-height:80px">' + (def ? 'COVER!' : 'BRAKE!') + '</button>');

/* 3. Garisan apex: tahan masuk jalur kuning, lepas bila keluar. Dua tepi dinilai berasingan */
function apexGame(title, hint, skill, cb) {

    '<div class="vd3" id="vd3"><span>Hold when the marker reaches the left edge of the band, release at the right edge.</span></div>' + holdBtn('apb', 'HOLD IN THE CORNER'));
  function dn(e) { if (done || xIn != null || !armed()) return; xIn = pos(tEv(e) - MGT.lat); hitMark('ap3', xIn, 'in'); }
